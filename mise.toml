[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.3"
npm = "11.20.0"
hk = { version = "2.2.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "pi --no-extensions -e {{config_root}}"
"pi:npm" = "pi --no-extensions -e npm:pi-openai-codex-compat"

[tasks.check]
description = "Run all non-writing quality checks and tests"
run = ["npm run check", "npm test"]
