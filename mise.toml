[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.2"
npm = "11.19.0"
hk = { version = "1.54.1", postinstall = "hk install --mise" }
betterleaks = "1.7.3"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "command pi --no-extensions -e {{config_root}}"
"pi:npm" = "command pi --no-extensions -e npm:pi-openai-codex-compat"

[tasks."test:live:codex"]
description = "Run live Pi/Codex continuation tests with gpt-5.6-luna"
run = '''
PI_CODEX_LIVE_API_KEY="$(./node_modules/.bin/pi auth print-bearer-token --provider openai-codex --model gpt-5.6-luna)" \
  npm run test:live:codex
'''
