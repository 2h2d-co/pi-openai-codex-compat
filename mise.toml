[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.4"
npm = "11.21.0"
hk = { version = "2.10.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
jactionlint = "2.3.0"
zizmor = "1.30.1"

[shell_alias]
"pi:local" = "{{config_root}}/node_modules/.bin/pi --no-extensions -e {{config_root}}"
"pi:npm" = "{{config_root}}/node_modules/.bin/pi --no-extensions -e npm:pi-openai-codex-compat"

[tasks.check]
description = "Run all non-writing quality checks and tests"
# Temporary: Pi 1.4.0 pins minimatch 10.2.6 (GHSA-g3hv-75wg-m249) in the Pi development
# dependency. Restore the full audit once a Pi release ships minimatch 11.0.1 or later.
run = [
  "hk check --all --check",
  "npm test",
  "npm audit --omit=dev",
  "npm run pack:dry",
]

[tasks.init]
description = "Install locked dependencies and Git hooks"
run = ["npm ci --ignore-scripts", "hk install --mise"]
