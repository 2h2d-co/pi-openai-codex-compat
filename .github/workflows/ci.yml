name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.9.11"
          install_args: --locked
          cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        # Temporary: Pi's npm-shrinkwrap pins brace-expansion 5.0.9 (GHSA-qhr7-859c-m2p7,
        # GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr) in the Pi development dependency. Restore the
        # full audit once a Pi release ships brace-expansion 5.0.12 or later.
        run: npm audit --omit=dev

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm run pack:dry
