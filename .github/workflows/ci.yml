name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: "2026.10.17"
          install_args: --locked
          cache: false

      - name: Install dependencies and Git hooks
        run: mise run init

      - name: Audit dependencies
        run: npm audit

      - name: Check
        run: hk check --all --check

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm run pack:dry
